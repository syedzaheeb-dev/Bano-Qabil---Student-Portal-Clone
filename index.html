<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Portal Bano Qabil</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <section class="first-section">
            <!-- <video autoplay muted loop src="../videos/WhatsApp Video 2026-11-08 at 12.54.29 PM.mp4"></video> -->

            <div class="headings-container">
                <h4>Student Access</h4>
                <h2>Pick Where You Left off.</h2>
                <p>Your courses, your classroom, your progress — all waiting <br>
                    on the other side.</p>
            </div>


        </section>


        <section class="login-card">
            <div class="card">
                <div class="image">
                    <img src="images/bano-qabil--logo.png" alt="" width="60px" height="57px">
                </div>

                <div class="headings">
                    <h3>Welcome Back!</h3>
                    <p>Let's get you learning again.</p>
                </div>

                <div class="inputs">
                    <h3>Student ID</h3>
                    <input type="number" id="student_id">
                    <h3>PIN</h3>
                    <input type="number" id="pin">
                </div>

                <div class="btn">
                    <button id="id_check">Continue</button>
                </div>
                <div class="create-account-link">
                    <p>New Here</p>
                    <a href="#">Create Account</a>
                </div>
            </div>
        </section>



    </main>
    <script src="script.js"></script>
</body>

</html>
